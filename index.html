<!doctype html>
<!-- es-CO y no en: el sitio está entero en español de Colombia. Con lang="en"
     Google lo clasificaba como inglés y los lectores de pantalla lo leían con
     fonética inglesa. -->
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <!-- Las fuentes, lo primero y en paralelo. Estaban en un @import dentro
         del CSS, que las ponía al final de una cadena en serie de cuatro
         pasos. Acá el navegador las ve antes de bajar nada más. -->
    <!-- Las dos fuentes del primer viewport, precargadas y propias.
         NO se pide nada a fonts.googleapis.com: los @font-face viven en
         src/fuentes.css y los archivos en /assets/fuentes. Una hoja de un
         tercero acá bloquea el renderizado ~750 ms para no aportar nada. -->
    <link rel="preload" as="font" type="font/woff2" href="/assets/fuentes/marcellus-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/assets/fuentes/mulish-latin.woff2" crossorigin />

    <!-- La conexión a Supabase, abierta desde el principio.

         La portada le pregunta el catálogo para pintar «Lo que hacemos» y
         «Piezas seleccionadas», y las fotos de esas dos secciones también
         viven ahí. Es otro origen: DNS + TCP + TLS son tres viajes de ida y
         vuelta —unos 450 ms en 4G lenta— que hasta el 30 de agosto de 2026 se
         pagaban DESPUÉS de que React montara, con todo lo demás ya terminado.

         Son dos líneas y no una a propósito: el navegador guarda por separado
         la conexión anónima —las fotos, que van en un <img> normal— de la que
         lleva credenciales —el fetch del catálogo, que manda cabeceras y por
         tanto es CORS—. Con una sola, la otra abre su propia conexión desde
         cero. Es el mismo motivo por el que Google Fonts pide dos.

         Vite sustituye la variable al compilar. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" />
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />

    <!-- La foto del hero, en paralelo con el JS.

         Es el elemento más grande del primer viewport y ya iba con
         fetchpriority alto, pero el navegador **no se enteraba de que existía**
         hasta ejecutar el bundle entero y renderizar React: la descarga
         empezaba tarde y el LCP se iba a 5,7 s.

         El srcset tiene que ser EXACTAMENTE el del <source> de `Foto`
         (src/components/Foto.jsx) y el sizes el del Hero, o el navegador se
         baja la imagen dos veces. Si cambian allí, cambian aquí. -->
    <link rel="preload" as="image" type="image/webp"
          imagesrcset="/assets/pen-hero-768.webp 768w, /assets/pen-hero-928.webp 928w"
          imagesizes="(max-width: 968px) 92vw, 40vw"
          fetchpriority="high" />

    <!-- La pieza, preguntada desde aquí y no desde el bundle.

         Quien abre el enlace que Valentina le mandó por WhatsApp cae directo
         en /catalogo/<uuid>, sin haber pasado por la portada. Ahí la foto de
         la pieza es el LCP, y el navegador no se enteraba de que existía hasta
         desenredar esta cadena entera —medida el 30 de agosto de 2026—:

             HTML 172 ms → index.js 330 ms → supabase.js 425 ms → pieza 881 ms → foto

         Cuatro eslabones en serie antes del primer byte de la imagen. Desde
         acá la pregunta sale con el HTML, en paralelo con todo lo demás: la
         respuesta llega sobre los 400 ms y la foto empieza a bajar mientras
         React todavía se está montando.

         La llave anónima ya viaja dentro del bundle público —todo lo que
         empieza por VITE_ acaba ahí—, así que escribirla acá no expone nada
         nuevo: es la misma lectura pública que hace el catálogo.

         La consulta está escrita dos veces, aquí y en `src/lib/apiPublica.js`,
         porque no hay forma de compartir una constante entre el HTML y el
         bundle. `apiPublica.test.js` compara las dos y tumba el build si dejan
         de coincidir. **Si tocas una, toca la otra.** -->
    <script>
      (function () {
        var url = '%VITE_SUPABASE_URL%';
        var clave = '%VITE_SUPABASE_ANON_KEY%';
        /* Si Vite no sustituyó las variables —un entorno sin ellas— acá queda
           el literal con los porcentajes. Mejor no preguntar nada y dejar que
           el módulo consulte por el camino normal, que salir a una URL
           inventada. */
        if (url.slice(0, 4) !== 'http') return;

        /* El uuid tal como lo escribe la ruta. Si no calza —una URL a medias,
           otra pantalla— no se pregunta nada: una consulta con un id inventado
           es un viaje perdido. */
        var ruta = location.pathname.match(/^\/catalogo\/([0-9a-f-]{36})\/?$/i);
        if (!ruta) return;

        window.__pieza = {
          id: ruta[1],
          promesa: fetch(
            url + '/rest/v1/products?select=id,name,category,description,price,compare_price,image_url,images,metal,piedra,talla_rango,stock,is_new,is_featured&id=eq.' + ruta[1],
            { headers: { apikey: clave, Authorization: 'Bearer ' + clave } }
          )
            .then(function (r) { return r.ok ? r.json() : null })
            .then(function (filas) { return (filas && filas[0]) || null })
            /* Resuelve en null y no rechaza: `traerPieza` lo lee como "no
               llegó" y pregunta otra vez por el camino normal. Una promesa
               rechazada acá, además, sería un error suelto en la consola. */
            .catch(function () { return null }),
        };
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/logo-isotipo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/logo-isotipo.png" />
    <!-- interactive-widget: al abrirse el teclado el navegador encoge el layout
         en vez de tapar la página. Sin esto, en un chat el campo de escribir
         queda debajo del teclado. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />

    <!-- Lo que sigue es lo que ve Google y lo que ve WhatsApp al compartir un
         enlace. Antes prometía cuatro cosas que el taller no cumple:
         "certificación de autenticidad" —cuesta $50.000 aparte—, "garantía de
         por vida" sin decir que es del metal, "platino" —no hay ninguna pieza—
         y "collares, pulseras y aretes", que tampoco existen todavía.

         Es la misma corrección que hicimos en la ficha, el catálogo y la
         pantalla de pago; ésta se había quedado suelta, y es la que se lee
         antes de entrar. -->
    <title>Anillos y joyas con esmeralda colombiana | Aurem Gs</title>
    <meta name="description" content="Piezas en plata 925 y oro 18k con esmeralda colombiana natural. Estuche y garantía en el metal. Entrega en 3 a 4 días en Bogotá y 4 a 6 al resto del país." />
    <link rel="canonical" href="https://www.auremgsjoyeria.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <meta property="og:title" content="Aurem Gs Joyería — Esmeralda colombiana en plata 925 y oro 18k" />
    <meta property="og:description" content="Cada pieza se fotografía como llega a tus manos. Estuche incluido y garantía de por vida en el metal. Contraentrega en Bogotá." />
    <meta property="og:image" content="https://www.auremgsjoyeria.com/assets/og-compartir.jpg" />
    <meta property="og:url" content="https://www.auremgsjoyeria.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aurem Gs Joyería" />
    <meta property="og:locale" content="es_CO" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aurem Gs Joyería — Esmeralda colombiana" />
    <meta name="twitter:description" content="Plata 925 y oro 18k. Estuche incluido y garantía de por vida en el metal." />
    <meta name="twitter:image" content="https://www.auremgsjoyeria.com/assets/og-compartir.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
