<!doctype html>
<!-- es-CO y no en: el sitio está entero en español de Colombia. Con lang="en"
     Google lo clasificaba como inglés y los lectores de pantalla lo leían con
     fonética inglesa. -->
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <!-- Las fuentes, lo primero y en paralelo. Estaban en un @import dentro
         del CSS, que las ponía al final de una cadena en serie de cuatro
         pasos. Acá el navegador las ve antes de bajar nada más. -->
    <!-- Las dos fuentes del primer viewport, precargadas y propias.
         NO se pide nada a fonts.googleapis.com: los @font-face viven en
         src/fuentes.css y los archivos en /assets/fuentes. Una hoja de un
         tercero acá bloquea el renderizado ~750 ms para no aportar nada. -->
    <link rel="preload" as="font" type="font/woff2" href="/assets/fuentes/marcellus-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/assets/fuentes/mulish-latin.woff2" crossorigin />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/logo-isotipo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/logo-isotipo.png" />
    <!-- interactive-widget: al abrirse el teclado el navegador encoge el layout
         en vez de tapar la página. Sin esto, en un chat el campo de escribir
         queda debajo del teclado. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />

    <!-- Lo que sigue es lo que ve Google y lo que ve WhatsApp al compartir un
         enlace. Antes prometía cuatro cosas que el taller no cumple:
         "certificación de autenticidad" —cuesta $50.000 aparte—, "garantía de
         por vida" sin decir que es del metal, "platino" —no hay ninguna pieza—
         y "collares, pulseras y aretes", que tampoco existen todavía.

         Es la misma corrección que hicimos en la ficha, el catálogo y la
         pantalla de pago; ésta se había quedado suelta, y es la que se lee
         antes de entrar. -->
    <title>Anillos y joyas con esmeralda colombiana | Aurem Gs</title>
    <meta name="description" content="Piezas en plata 925 y oro 18k con esmeralda colombiana natural. Estuche y garantía en el metal. Entrega en 3 a 4 días en Bogotá y 4 a 6 al resto del país." />
    <link rel="canonical" href="https://www.auremgsjoyeria.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <meta property="og:title" content="Aurem Gs Joyería — Esmeralda colombiana en plata 925 y oro 18k" />
    <meta property="og:description" content="Cada pieza se fotografía como llega a tus manos. Estuche incluido y garantía de por vida en el metal. Contraentrega en Bogotá." />
    <meta property="og:image" content="https://www.auremgsjoyeria.com/assets/og-compartir.jpg" />
    <meta property="og:url" content="https://www.auremgsjoyeria.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aurem Gs Joyería" />
    <meta property="og:locale" content="es_CO" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aurem Gs Joyería — Esmeralda colombiana" />
    <meta name="twitter:description" content="Plata 925 y oro 18k. Estuche incluido y garantía de por vida en el metal." />
    <meta name="twitter:image" content="https://www.auremgsjoyeria.com/assets/og-compartir.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
